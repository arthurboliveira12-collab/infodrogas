<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Reverie - First Person Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; /* Retro Font */
            user-select: none;
            image-rendering: pixelated; /* Retro look for UI if needed */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Health & Level HUD */
        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-label {
            color: #ccc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px black;
        }

        #health-bar-container {
            width: 250px;
            height: 20px;
            background-color: rgba(20, 0, 0, 0.8);
            border: 2px solid #300;
            border-radius: 4px;
            overflow: hidden;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #cc0000, #ff0055);
            transition: width 0.2s ease-out;
        }

        #level-display {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        #xp-bar-container {
            width: 250px;
            height: 10px;
            background-color: #111;
            border: 2px solid #222;
            border-radius: 0px;
            margin-top: -5px;
        }

        #xp-bar {
            width: 0%;
            height: 100%;
            background-color: #9900ff;
            transition: width 0.3s ease;
        }

        /* Interaction Prompt */
        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 0px #000;
            display: none;
        }

        /* Screens */
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            cursor: pointer;
        }

        .title {
            font-size: 50px;
            font-weight: bold;
            color: #ff0055;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px #440022;
        }

        .instructions {
            font-size: 20px;
            color: #00ffcc;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #000;
        }

        .btn {
            padding: 15px 40px;
            background-color: #220033;
            color: #00ffcc;
            border: 4px solid #00ffcc;
            border-radius: 0px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #00ffcc;
            color: #220033;
        }

        /* Blood overlay for damage */
        #damage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(200, 0, 0, 0.4) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 5;
        }

    </style>
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="damage-overlay"></div>
        <div id="crosshair"></div>
        <div id="interaction-prompt">Pressione E para abrir</div>
        
        <div id="hud">
            <div id="level-display">Nível <span id="lvl-val">1</span></div>
            <div id="xp-bar-container"><div id="xp-bar"></div></div>
            <div class="stat-label">Vida</div>
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="blocker">
        <div id="menu-content" class="flex flex-col items-center">
            <div class="title" id="menu-title">Dark Reverie</div>
            <div class="instructions" id="menu-instructions">
                Uma jornada na escuridão.<br><br>
                WASD = Mover<br>
                MOUSE = Olhar<br>
                CLIQUE ESQUERDO = Atacar<br><br>
                Explore o mundo sombrio.
            </div>
            <button class="btn" id="start-btn">Clique para Jogar</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Game State Variables
        let camera, scene, renderer, controls;
        let prevTime = performance.now();
        
        // Movement state
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        const playerSpeed = 300.0;
        
        // RPG Stats
        let maxHealth = 100;
        let currentHealth = 100;
        let level = 1;
        let xp = 0;
        let xpToNext = 5;
        let isDead = false;

        // Weapon Animation State
        let swordGroup;
        let isAttacking = false;
        let attackProgress = 0;

        // Entities & Environment
        const enemies = [];
        const collidableObjects = []; // For basic wall collisions
        let floorObjects = []; // For ground detection
        const damageAmount = 20;
        const damageCooldown = 1.0; 
        let lastDamageTime = 0;
        
        // Interactive Elements
        let doorMesh;
        let doorPivot;
        let isDoorOpen = false;
        let doorAnimationProgress = 0;
        let isAnimatingDoor = false;

        // Raycasting for combat and ground
        const raycaster = new THREE.Raycaster();
        const groundRaycaster = new THREE.Raycaster();
        const centerCoords = new THREE.Vector2(0, 0); 

        // DOM Elements
        const blocker = document.getElementById('blocker');
        const menuTitle = document.getElementById('menu-title');
        const menuInstructions = document.getElementById('menu-instructions');
        const startBtn = document.getElementById('start-btn');
        const healthBar = document.getElementById('health-bar');
        const lvlVal = document.getElementById('lvl-val');
        const xpBar = document.getElementById('xp-bar');
        const damageOverlay = document.getElementById('damage-overlay');
        const interactionPrompt = document.getElementById('interaction-prompt');

        init();
        animate();

        function init() {
            // 1. Scene Setup - Retro PS1 Style (Saturated, Dramatic Fog)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0033); // Deep purple
            scene.fog = new THREE.FogExp2(0x1a0033, 0.025); // Thick saturated fog

            // 2. Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 0); // Player height

            // Player Weapon (Low Poly Retro Asta's Sword)
            swordGroup = new THREE.Group();
            
            // Blade (Black, flat shading)
            const bladeGeo = new THREE.BoxGeometry(1.5, 6, 0.2);
            const bladeMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 3;
            swordGroup.add(blade);
            
            // Guard
            const guardGeo = new THREE.BoxGeometry(2.5, 0.5, 0.6);
            const guardMat = new THREE.MeshLambertMaterial({ color: 0x330000 });
            const guard = new THREE.Mesh(guardGeo, guardMat);
            swordGroup.add(guard);

            // Handle
            const handleGeo = new THREE.BoxGeometry(0.3, 1.5, 0.3); // Blocky handle
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x2a1a1a });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -1;
            swordGroup.add(handle);

            swordGroup.position.set(1.5, -2, -3);
            swordGroup.rotation.x = -Math.PI / 4;
            swordGroup.rotation.y = Math.PI / 6;
            camera.add(swordGroup);
            scene.add(camera);

            // 3. Lighting - Dramatic, neon/saturated accents
            const ambientLight = new THREE.AmbientLight(0x221144, 1.0); 
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff0055, 2, 50); // Redish light in library
            pointLight.position.set(0, 8, 0);
            scene.add(pointLight);

            const directionalLight = new THREE.DirectionalLight(0x00ffcc, 0.5); // Teal moonlight
            directionalLight.position.set(-20, 50, -20);
            scene.add(directionalLight);

            // 4. Environment Construction (PS1 Style)
            buildLevel();

            // 5. Renderer - Pixelated, no AA
            renderer = new THREE.WebGLRenderer({ antialias: false });
            // Lower pixel ratio for retro look (adjust multiplier for chunkiness)
            renderer.setPixelRatio(window.devicePixelRatio > 1 ? 0.5 : 0.25); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 6. Controls
            controls = new PointerLockControls(camera, document.body);

            startBtn.addEventListener('click', () => {
                if(isDead) resetGame();
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                if(!isDead) {
                    blocker.style.display = 'flex';
                    menuTitle.innerText = 'PAUSADO';
                    menuInstructions.innerText = 'Clique abaixo para continuar.';
                    startBtn.innerText = 'Continuar';
                }
            });

            scene.add(controls.getObject());

            // 7. Input Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'KeyE': handleInteraction(); break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            const onMouseClick = function (event) {
                if (controls.isLocked && !isDead) {
                    if (!isAttacking) {
                        isAttacking = true;
                        attackProgress = 0;
                        attack();
                    }
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseClick);
            window.addEventListener('resize', onWindowResize);
        }

        function buildLevel() {
            // Materials (Basic colors, flat looking for retro vibe)
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x332222 });
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x222233 });
            const woodMat = new THREE.MeshLambertMaterial({ color: 0x3a2000 });
            const pathMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x003311 });
            const castleMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            // A. Library Tower (Spawn Room)
            const roomSize = 20;
            const roomHeight = 15;
            
            // Floor
            const libFloor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
            libFloor.rotation.x = -Math.PI / 2;
            scene.add(libFloor);
            floorObjects.push(libFloor);

            // Walls (Back, Left, Right)
            const wallGeo = new THREE.BoxGeometry(roomSize, roomHeight, 1);
            const wallB = new THREE.Mesh(wallGeo, wallMat); wallB.position.set(0, roomHeight/2, roomSize/2);
            const wallL = new THREE.Mesh(wallGeo, wallMat); wallL.position.set(-roomSize/2, roomHeight/2, 0); wallL.rotation.y = Math.PI/2;
            const wallR = new THREE.Mesh(wallGeo, wallMat); wallR.position.set(roomSize/2, roomHeight/2, 0); wallR.rotation.y = Math.PI/2;
            
            // Front Wall (with hole for door)
            const wallF1 = new THREE.Mesh(new THREE.BoxGeometry(roomSize/2 - 3, roomHeight, 1), wallMat);
            wallF1.position.set(-roomSize/4 - 1.5, roomHeight/2, -roomSize/2);
            const wallF2 = new THREE.Mesh(new THREE.BoxGeometry(roomSize/2 - 3, roomHeight, 1), wallMat);
            wallF2.position.set(roomSize/4 + 1.5, roomHeight/2, -roomSize/2);
            const wallF3 = new THREE.Mesh(new THREE.BoxGeometry(6, roomHeight - 8, 1), wallMat); // Above door
            wallF3.position.set(0, roomHeight - (roomHeight-8)/2, -roomSize/2);

            scene.add(wallB, wallL, wallR, wallF1, wallF2, wallF3);
            collidableObjects.push(wallB, wallL, wallR, wallF1, wallF2);

            // Bookshelves (Colored boxes)
            for(let i=0; i<8; i++) {
                const shelf = new THREE.Mesh(new THREE.BoxGeometry(3, 8, 2), new THREE.MeshLambertMaterial({color: Math.random() * 0xffffff}));
                shelf.position.set((Math.random()-0.5)*12, 4, (Math.random()-0.5)*12);
                // Keep center clear
                if(shelf.position.distanceTo(new THREE.Vector3(0,4,0)) > 5) {
                    scene.add(shelf);
                    collidableObjects.push(shelf);
                }
            }

            // Interactive Door
            doorPivot = new THREE.Group();
            doorPivot.position.set(-3, 0, -roomSize/2); // Hinge position
            
            doorMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 0.5), woodMat);
            doorMesh.position.set(3, 4, 0); // Offset from pivot
            doorPivot.add(doorMesh);
            scene.add(doorPivot);
            collidableObjects.push(doorMesh);

            // B. Stone Path & Forest
            const pathLength = 150;
            const path = new THREE.Mesh(new THREE.PlaneGeometry(10, pathLength), pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.1, -roomSize/2 - pathLength/2);
            scene.add(path);
            floorObjects.push(path);

            // Trees (Retro style)
            const treeGeo = new THREE.ConeGeometry(3, 10, 4); // 4-sided pyramid for retro look
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 5, 4);
            
            for(let i=0; i<30; i++) {
                const zPos = -roomSize/2 - Math.random() * pathLength;
                const xPos = (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 10); // Placed on sides
                
                const tree = new THREE.Group();
                const leaves = new THREE.Mesh(treeGeo, leafMat); leaves.position.y = 7;
                const trunk = new THREE.Mesh(trunkGeo, woodMat); trunk.position.y = 2.5;
                tree.add(leaves, trunk);
                tree.position.set(xPos, 0, zPos);
                scene.add(tree);
                collidableObjects.push(trunk); // Collide with trunks
            }

            // C. Bridge
            const bridgeLength = 80;
            const bridgeZStart = -roomSize/2 - pathLength;
            const bridge = new THREE.Mesh(new THREE.PlaneGeometry(6, bridgeLength), woodMat);
            bridge.rotation.x = -Math.PI / 2;
            bridge.position.set(0, 0.2, bridgeZStart - bridgeLength/2);
            scene.add(bridge);
            floorObjects.push(bridge);

            // D. Castle (End of bridge)
            const castleZ = bridgeZStart - bridgeLength - 20;
            const castleGroup = new THREE.Group();
            
            // Main Keep
            const keep = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40), castleMat);
            keep.position.set(0, 20, castleZ);
            castleGroup.add(keep);
            collidableObjects.push(keep);

            // Towers
            const towerGeo = new THREE.BoxGeometry(10, 60, 10);
            const t1 = new THREE.Mesh(towerGeo, castleMat); t1.position.set(-20, 30, castleZ + 20);
            const t2 = new THREE.Mesh(towerGeo, castleMat); t2.position.set(20, 30, castleZ + 20);
            castleGroup.add(t1, t2);
            collidableObjects.push(t1, t2);

            // Glowing Windows
            const winMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const winGeo = new THREE.BoxGeometry(2, 4, 11); // protrudes slightly on Z
            const w1 = new THREE.Mesh(winGeo, winMat); w1.position.set(-20, 45, castleZ + 20);
            const w2 = new THREE.Mesh(winGeo, winMat); w2.position.set(20, 45, castleZ + 20);
            castleGroup.add(w1, w2);

            scene.add(castleGroup);

            // Spawn initial enemies along path and bridge
            for(let i=0; i<15; i++) {
                spawnEnemy(-roomSize/2 - 20 - Math.random() * (pathLength + bridgeLength - 30));
            }
        }

        function handleInteraction() {
            if(!controls.isLocked || isDead) return;

            // Check distance to door
            const playerPos = controls.getObject().position;
            const doorPos = new THREE.Vector3(0, 4, -10); // Center of door arch
            
            if (playerPos.distanceTo(doorPos) < 15 && !isAnimatingDoor) {
                isAnimatingDoor = true;
                // Toggle collision based on door state *after* animation starts
                if(isDoorOpen) {
                    collidableObjects.push(doorMesh);
                } else {
                    const index = collidableObjects.indexOf(doorMesh);
                    if (index > -1) collidableObjects.splice(index, 1);
                }
            }
        }

        function spawnEnemy(specificZ = null) {
            // Blocky Skeleton
            const skeletonGroup = new THREE.Group();
            const boneMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });

            // Skull (Box)
            const skull = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), boneMat);
            skull.position.y = 5;
            skeletonGroup.add(skull);

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 1), boneMat);
            body.position.y = 2.5;
            skeletonGroup.add(body);

            // Arms
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3, 0.8), boneMat);
            const lArm = arm.clone(); lArm.position.set(-1.5, 3, 0); skeletonGroup.add(lArm);
            const rArm = arm.clone(); rArm.position.set(1.5, 3, 0); skeletonGroup.add(rArm);
            
            // Placement
            const zPos = specificZ !== null ? specificZ : (-30 - Math.random() * 200); // Along path
            const xSpread = (zPos < -160 && zPos > -240) ? 2 : 4; // Narrower on bridge
            const xPos = (Math.random() - 0.5) * xSpread;

            skeletonGroup.position.set(xPos, 1.5, zPos);
            
            skeletonGroup.userData = { 
                bobOffset: Math.random() * Math.PI * 2,
                hp: 2,
                originalMat: boneMat
            };

            scene.add(skeletonGroup);
            enemies.push(skeletonGroup);
        }

        function attack() {
            raycaster.setFromCamera(centerCoords, camera);
            const attackRange = 15;
            const intersects = raycaster.intersectObjects(enemies, true);

            if (intersects.length > 0 && intersects[0].distance <= attackRange) {
                let hitEnemy = intersects[0].object;
                while (hitEnemy.parent && hitEnemy.parent.type !== 'Scene' && !enemies.includes(hitEnemy)) {
                    hitEnemy = hitEnemy.parent;
                }

                if (enemies.includes(hitEnemy)) {
                    // Level increases damage
                    const damageDealt = 1 + Math.floor(level * 0.5);
                    hitEnemy.userData.hp -= damageDealt;
                    
                    // Flash red
                    hitEnemy.children.forEach(child => {
                        child.material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                    });

                    setTimeout(() => {
                        if (hitEnemy && hitEnemy.parent) {
                            hitEnemy.children.forEach(child => {
                                child.material = hitEnemy.userData.originalMat;
                            });
                        }
                    }, 150);

                    // Show DMG number (simple DOM element overlaid)
                    showDamageNumber(damageDealt);

                    if (hitEnemy.userData.hp <= 0) {
                        scene.remove(hitEnemy);
                        const index = enemies.indexOf(hitEnemy);
                        if (index > -1) enemies.splice(index, 1);
                        gainXP(1);
                        
                        // Respawn somewhere along the path
                        setTimeout(() => spawnEnemy(), 3000);
                    }
                }
            }
        }

        function showDamageNumber(amount) {
            const dmgEl = document.createElement('div');
            dmgEl.innerText = amount;
            dmgEl.style.position = 'absolute';
            dmgEl.style.left = '50%';
            dmgEl.style.top = '50%';
            dmgEl.style.color = 'red';
            dmgEl.style.fontWeight = 'bold';
            dmgEl.style.fontSize = '30px';
            dmgEl.style.pointerEvents = 'none';
            dmgEl.style.transform = `translate(-50%, -50%) translate(${(Math.random()-0.5)*50}px, ${(Math.random()-0.5)*50}px)`;
            dmgEl.style.textShadow = '2px 2px 0px #000';
            dmgEl.style.zIndex = '20';
            document.body.appendChild(dmgEl);

            let opacity = 1;
            let topPos = 50;
            const anim = setInterval(() => {
                opacity -= 0.05;
                topPos -= 1;
                dmgEl.style.opacity = opacity;
                dmgEl.style.top = topPos + '%';
                if(opacity <= 0) {
                    clearInterval(anim);
                    dmgEl.remove();
                }
            }, 50);
        }

        function gainXP(amount) {
            xp += amount;
            if (xp >= xpToNext) levelUp();
            updateHUD();
        }

        function levelUp() {
            level++;
            xp -= xpToNext;
            xpToNext = Math.floor(xpToNext * 1.5);
            currentHealth = maxHealth;
            
            damageOverlay.style.background = 'radial-gradient(circle, transparent 50%, rgba(0, 255, 200, 0.4) 100%)';
            damageOverlay.style.opacity = '1';
            setTimeout(() => {
                damageOverlay.style.opacity = '0';
                setTimeout(() => {
                    damageOverlay.style.background = 'radial-gradient(circle, transparent 50%, rgba(200, 0, 0, 0.4) 100%)';
                }, 200);
            }, 150);
        }

        function takeDamage(amount) {
            const now = performance.now() / 1000;
            if (now - lastDamageTime < damageCooldown) return;
            
            lastDamageTime = now;
            currentHealth -= amount;
            if (currentHealth <= 0) {
                currentHealth = 0;
                die();
            }
            damageOverlay.style.opacity = '1';
            setTimeout(() => { if(!isDead) damageOverlay.style.opacity = '0'; }, 300);
            updateHUD();
        }

        function die() {
            isDead = true;
            controls.unlock();
            blocker.style.display = 'flex';
            menuTitle.innerText = 'VOCÊ MORREU';
            menuTitle.style.color = '#ff0000';
            menuInstructions.innerHTML = `Nível alcançado: ${level}.<br>O vazio o chama.`;
            startBtn.innerText = 'Tentar Novamente';
        }

        function resetGame() {
            maxHealth = 100; currentHealth = maxHealth;
            level = 1; xp = 0; xpToNext = 5;
            isDead = false; lastDamageTime = 0;
            damageOverlay.style.opacity = '0';
            
            // Close door
            isDoorOpen = false;
            doorAnimationProgress = 0;
            doorPivot.rotation.y = 0;
            if(!collidableObjects.includes(doorMesh)) collidableObjects.push(doorMesh);

            controls.getObject().position.set(0, 5, 0);

            enemies.forEach(e => scene.remove(e));
            enemies.length = 0;
            for(let i=0; i<15; i++) spawnEnemy(-10 - Math.random() * 200);

            updateHUD();
        }

        function updateHUD() {
            healthBar.style.width = Math.max(0, (currentHealth / maxHealth) * 100) + '%';
            lvlVal.innerText = level;
            xpBar.style.width = Math.min(100, (xp / xpToNext) * 100) + '%';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkCollision(targetPosition) {
            // Very basic AABB collision against collidableObjects
            const playerBox = new THREE.Box3();
            const playerSize = 2.0; // Collision radius roughly
            playerBox.setFromCenterAndSize(targetPosition, new THREE.Vector3(playerSize, 10, playerSize));

            for(let i=0; i<collidableObjects.length; i++) {
                const obj = collidableObjects[i];
                const objBox = new THREE.Box3().setFromObject(obj);
                if(playerBox.intersectsBox(objBox)) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); 

            if (controls.isLocked && !isDead) {
                // UI Prompts
                const playerPos = controls.getObject().position;
                const doorPos = new THREE.Vector3(0, 4, -10);
                if(playerPos.distanceTo(doorPos) < 15) {
                    interactionPrompt.style.display = 'block';
                    interactionPrompt.innerText = isDoorOpen ? "Pressione E para fechar" : "Pressione E para abrir";
                } else {
                    interactionPrompt.style.display = 'none';
                }

                // Door Animation
                if(isAnimatingDoor) {
                    const targetAngle = isDoorOpen ? 0 : -Math.PI / 2;
                    const currentAngle = doorPivot.rotation.y;
                    const diff = targetAngle - currentAngle;
                    
                    doorPivot.rotation.y += diff * delta * 5;
                    
                    if(Math.abs(diff) < 0.05) {
                        doorPivot.rotation.y = targetAngle;
                        isAnimatingDoor = false;
                        isDoorOpen = !isDoorOpen;
                    }
                }

                // Player Movement Physics
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * playerSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * playerSpeed * delta;

                // Predict next position
                const currentPos = controls.getObject().position.clone();
                const nextPosX = currentPos.clone().add(new THREE.Vector3(-velocity.x * delta, 0, 0));
                const nextPosZ = currentPos.clone().add(new THREE.Vector3(0, 0, -velocity.z * delta));

                // Apply movement if no collision
                if(!checkCollision(nextPosX)) controls.moveRight(-velocity.x * delta);
                else velocity.x = 0;
                
                if(!checkCollision(nextPosZ)) controls.moveForward(-velocity.z * delta);
                else velocity.z = 0;

                // Fix height (prevent falling off easily, but keep simple)
                controls.getObject().position.y = 5;

                // Fall off edge detection (Very simple check based on Z bounds for bridge)
                const pZ = controls.getObject().position.z;
                const pX = controls.getObject().position.x;
                // If on bridge section (-160 to -240 approx) and walk off edges
                if(pZ < -160 && pZ > -240) {
                    if(Math.abs(pX) > 4) takeDamage(100); // Fell off
                }

                // --- Sword Animation ---
                if (isAttacking) {
                    attackProgress += delta * 5; 
                    if (attackProgress < 0.5) {
                        const p = attackProgress * 2;
                        swordGroup.rotation.x = -Math.PI / 4 - (p * Math.PI / 2.5);
                        swordGroup.position.z = -3 - (p * 2);
                    } else if (attackProgress < 1.0) {
                        const p = (attackProgress - 0.5) * 2;
                        swordGroup.rotation.x = -Math.PI / 4 - (Math.PI / 2.5) + (p * Math.PI / 2.5);
                        swordGroup.position.z = -5 + (p * 2);
                    } else {
                        isAttacking = false;
                        swordGroup.rotation.x = -Math.PI / 4;
                        swordGroup.position.z = -3;
                    }
                }

                // --- Enemy AI (Passive Bobbing & Look) ---
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.position.y = 1.5 + Math.sin((time/1000) * 2 + enemy.userData.bobOffset) * 0.3;
                    const targetRotation = Math.atan2(playerPos.x - enemy.position.x, playerPos.z - enemy.position.z);
                    const currentRotation = enemy.rotation.y;
                    enemy.rotation.y = currentRotation + (targetRotation - currentRotation) * delta * 2;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
