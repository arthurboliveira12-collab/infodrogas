<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Reverie - First Person Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the canvas */
            z-index: 10;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Health & Level HUD */
        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-label {
            color: #ccc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px black;
        }

        #health-bar-container {
            width: 250px;
            height: 20px;
            background-color: rgba(20, 0, 0, 0.8);
            border: 2px solid #300;
            border-radius: 4px;
            overflow: hidden;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #800000, #ff1a1a);
            transition: width 0.2s ease-out;
        }

        #level-display {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #xp-bar-container {
            width: 250px;
            height: 6px;
            background-color: #111;
            border-radius: 3px;
            overflow: hidden;
            margin-top: -5px;
        }

        #xp-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5cf6;
            transition: width 0.3s ease;
        }

        /* Screens */
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            cursor: pointer;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #aa0000;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff000055;
        }

        .instructions {
            font-size: 18px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            background-color: #300;
            color: white;
            border: 1px solid #700;
            border-radius: 6px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #500;
            box-shadow: 0 0 15px #f005;
        }

        /* Blood overlay for damage */
        #damage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(200, 0, 0, 0.4) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 5;
        }

    </style>
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="damage-overlay"></div>
        <div id="crosshair"></div>
        
        <div id="hud">
            <div id="level-display">Nível <span id="lvl-val">1</span></div>
            <div id="xp-bar-container"><div id="xp-bar"></div></div>
            <div class="stat-label">Vida</div>
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="blocker">
        <div id="menu-content" class="flex flex-col items-center">
            <div class="title" id="menu-title">Dark Reverie</div>
            <div class="instructions" id="menu-instructions">
                Uma jornada na escuridão.<br><br>
                WASD = Mover<br>
                MOUSE = Olhar<br>
                CLIQUE ESQUERDO = Atacar<br><br>
                Explore o mundo sombrio.
            </div>
            <button class="btn" id="start-btn">Clique para Jogar</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Game State Variables
        let camera, scene, renderer, controls;
        let prevTime = performance.now();
        
        // Movement state
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // RPG Stats
        let maxHealth = 100;
        let currentHealth = 100;
        let level = 1;
        let xp = 0;
        let xpToNext = 5;
        let isDead = false;

        // Weapon Animation State
        let swordGroup;
        let isAttacking = false;
        let attackProgress = 0;

        // Entities
        const enemies = [];
        const damageAmount = 20;
        const damageCooldown = 1.0; // seconds
        let lastDamageTime = 0;

        // Raycasting for combat
        const raycaster = new THREE.Raycaster();
        const centerCoords = new THREE.Vector2(0, 0); // Always center for crosshair

        // DOM Elements
        const blocker = document.getElementById('blocker');
        const menuTitle = document.getElementById('menu-title');
        const menuInstructions = document.getElementById('menu-instructions');
        const startBtn = document.getElementById('start-btn');
        const healthBar = document.getElementById('health-bar');
        const lvlVal = document.getElementById('lvl-val');
        const xpBar = document.getElementById('xp-bar');
        const damageOverlay = document.getElementById('damage-overlay');

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            // Dark, moody fog - Brighter to fix pitch black screen
            scene.background = new THREE.Color(0x13151a);
            scene.fog = new THREE.FogExp2(0x13151a, 0.025);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10; // Player height

            // Player Weapon (Asta's Demon-Slayer Sword)
            swordGroup = new THREE.Group();
            
            // Blade (Massive, dark, broad)
            const bladeGeo = new THREE.BoxGeometry(2.5, 7, 0.4);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7, metalness: 0.3 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 3.5;
            swordGroup.add(blade);
            
            // Guard
            const guardGeo = new THREE.BoxGeometry(3.5, 0.5, 1.0);
            const guardMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });
            const guard = new THREE.Mesh(guardGeo, guardMat);
            swordGroup.add(guard);

            // Handle
            const handleGeo = new THREE.CylinderGeometry(0.3, 0.3, 2, 16);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -1;
            swordGroup.add(handle);

            // Position sword on the right side of the screen
            swordGroup.position.set(2.5, -2.5, -4);
            swordGroup.rotation.x = -Math.PI / 4;
            swordGroup.rotation.y = Math.PI / 6; // Angle it so we see the flat blade
            camera.add(swordGroup);
            scene.add(camera);

            // 3. Lighting
            const ambientLight = new THREE.AmbientLight(0x303545, 2.0); // Moonlit ambient
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x8888aa, 1.5);
            directionalLight.position.set(50, 100, 50);
            scene.add(directionalLight);

            // 4. Environment
            // Ground
            const floorGeometry = new THREE.PlaneGeometry(1000, 1000, 50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x111215, 
                roughness: 0.9, 
                metalness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Grid for visibility
            const gridHelper = new THREE.GridHelper(1000, 100, 0x000000, 0x000000);
            gridHelper.position.y = 0.05;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // Scenery (Tombstones and Dead Trees)
            const tombstoneGeo = new THREE.BoxGeometry(3, 4, 1);
            const tombstoneMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
            
            const treeGeo = new THREE.CylinderGeometry(0.8, 1.5, 20, 7);
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x1a120e, roughness: 1.0 });

            for (let i = 0; i < 150; i++) {
                const isTree = Math.random() > 0.5;
                const mesh = isTree ? new THREE.Mesh(treeGeo, treeMat) : new THREE.Mesh(tombstoneGeo, tombstoneMat);
                
                mesh.position.x = (Math.random() - 0.5) * 600;
                mesh.position.z = (Math.random() - 0.5) * 600;
                mesh.position.y = isTree ? 10 : 2; 
                
                if (isTree) {
                    mesh.rotation.x = (Math.random() - 0.5) * 0.2;
                    mesh.rotation.z = (Math.random() - 0.5) * 0.2;
                }

                // Keep clear of center spawn
                if (mesh.position.distanceTo(new THREE.Vector3(0, 0, 0)) > 30) {
                    scene.add(mesh);
                }
            }

            // 5. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 6. Controls
            controls = new PointerLockControls(camera, document.body);

            startBtn.addEventListener('click', () => {
                if(isDead) resetGame();
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                if(!isDead) {
                    blocker.style.display = 'flex';
                    menuTitle.innerText = 'PAUSED';
                    menuInstructions.innerText = 'Click below to resume.';
                    startBtn.innerText = 'Resume';
                }
            });

            scene.add(controls.getObject());

            // 7. Input Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                }
            };

            const onMouseClick = function (event) {
            if (controls.isLocked && !isDead) {
                if (!isAttacking) {
                    isAttacking = true;
                    attackProgress = 0;
                    attack();
                }
            }
        };

        document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseClick);
            window.addEventListener('resize', onWindowResize);

        // Initial Enemies
        for(let i=0; i<20; i++) {
            spawnEnemy();
        }
    }

    function spawnEnemy() {
        // Skeleton Group
        const skeletonGroup = new THREE.Group();
        const boneMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 });

        // Skull
        const skullGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const skull = new THREE.Mesh(skullGeo, boneMat);
        skull.position.y = 6;
        skeletonGroup.add(skull);

        // Spine / Ribcage
        const spineGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 8);
        const spine = new THREE.Mesh(spineGeo, boneMat);
        spine.position.y = 3.5;
        skeletonGroup.add(spine);

        // Arms
        const armGeo = new THREE.CylinderGeometry(0.3, 0.3, 2.5, 8);
        const leftArm = new THREE.Mesh(armGeo, boneMat);
        leftArm.position.set(-1.2, 4, 0);
        leftArm.rotation.z = Math.PI / 4;
        skeletonGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, boneMat);
        rightArm.position.set(1.2, 4, 0);
        rightArm.rotation.z = -Math.PI / 4;
        skeletonGroup.add(rightArm);
        
        // Spawn location
        const angle = Math.random() * Math.PI * 2;
        const distance = 15 + Math.random() * 100;
        
        skeletonGroup.position.x = controls.getObject().position.x + Math.cos(angle) * distance;
        skeletonGroup.position.z = controls.getObject().position.z + Math.sin(angle) * distance;
        skeletonGroup.position.y = 2; // Float slightly above ground
        
        skeletonGroup.userData = { 
            bobOffset: Math.random() * Math.PI * 2,
            hp: 3,
            originalMat: boneMat
        };

        // Face the center roughly
        skeletonGroup.lookAt(0, 2, 0);

        scene.add(skeletonGroup);
        enemies.push(skeletonGroup);
    }

    function attack() {
        // Melee Raycast from center of camera
        raycaster.setFromCamera(centerCoords, camera);
        const attackRange = 18;

        // Check intersections with all parts of the skeletons
        const intersects = raycaster.intersectObjects(enemies, true);

        if (intersects.length > 0 && intersects[0].distance <= attackRange) {
            // Find the parent skeleton group
            let hitEnemy = intersects[0].object;
            while (hitEnemy.parent && hitEnemy.parent.type !== 'Scene' && !enemies.includes(hitEnemy)) {
                hitEnemy = hitEnemy.parent;
            }

            if (enemies.includes(hitEnemy)) {
                hitEnemy.userData.hp -= 1;
                
                // Flash red
                hitEnemy.children.forEach(child => {
                    child.material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                });

                setTimeout(() => {
                    if (hitEnemy && hitEnemy.parent) {
                        hitEnemy.children.forEach(child => {
                            child.material = hitEnemy.userData.originalMat;
                        });
                    }
                }, 150);

                // Die
                if (hitEnemy.userData.hp <= 0) {
                    scene.remove(hitEnemy);
                    const index = enemies.indexOf(hitEnemy);
                    if (index > -1) {
                        enemies.splice(index, 1);
                    }
                    gainXP(1);
                    
                    // Spawn replacement skeletons
                    spawnEnemy();
                    if(Math.random() < 0.4) spawnEnemy(); 
                }
            }
        }
    }

    function gainXP(amount) {
            xp += amount;
            if (xp >= xpToNext) {
                levelUp();
            }
            updateHUD();
        }

        function levelUp() {
            level++;
            xp -= xpToNext;
            xpToNext = Math.floor(xpToNext * 1.5); // Increase required XP
            
            // Heal player slightly or fully on level up
            currentHealth = maxHealth;
            
            // Visual feedback for level up (flash screen)
            damageOverlay.style.background = 'radial-gradient(circle, transparent 50%, rgba(255, 255, 255, 0.4) 100%)';
            damageOverlay.style.opacity = '1';
            setTimeout(() => {
                damageOverlay.style.opacity = '0';
                setTimeout(() => {
                    damageOverlay.style.background = 'radial-gradient(circle, transparent 50%, rgba(200, 0, 0, 0.4) 100%)';
                }, 200);
            }, 150);

        }

        function takeDamage(amount) {
            const now = performance.now() / 1000;
            if (now - lastDamageTime < damageCooldown) return; // i-frames

            lastDamageTime = now;
            currentHealth -= amount;
            if (currentHealth <= 0) {
                currentHealth = 0;
                die();
            }

            // Visual feedback
            damageOverlay.style.opacity = '1';
            setTimeout(() => {
                if(!isDead) damageOverlay.style.opacity = '0';
            }, 300);

            updateHUD();
        }

        function die() {
        isDead = true;
        controls.unlock();
        
        blocker.style.display = 'flex';
        menuTitle.innerText = 'VOCÊ MORREU';
        menuTitle.style.color = '#ff0000';
        menuInstructions.innerHTML = `Você chegou ao Nível ${level}.<br>A escuridão te consumiu.`;
        startBtn.innerText = 'Tentar Novamente';
    }

    function resetGame() {
            // Reset Stats
            maxHealth = 100;
            currentHealth = maxHealth;
            level = 1;
            xp = 0;
            xpToNext = 5;
            isDead = false;
            lastDamageTime = 0;
            damageOverlay.style.opacity = '0';

            // Reset Player Pos
            controls.getObject().position.set(0, 10, 0);

            // Clear Enemies
        enemies.forEach(e => scene.remove(e));
        enemies.length = 0;

        // Spawn Initial Enemies
        for(let i=0; i<20; i++) {
            spawnEnemy();
        }

        updateHUD();
    }

    function updateHUD() {
            const hpPercent = Math.max(0, (currentHealth / maxHealth) * 100);
            healthBar.style.width = hpPercent + '%';
            
            lvlVal.innerText = level;
            
            const xpPercent = Math.min(100, (xp / xpToNext) * 100);
            xpBar.style.width = xpPercent + '%';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        // Delta in seconds
        const delta = Math.min((time - prevTime) / 1000, 0.1); 

        if (controls.isLocked && !isDead) {

            // Player Movement Physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            const speed = 400.0;

            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);

            // Fix height
            controls.getObject().position.y = 10;

            // --- Sword Animation ---
            if (isAttacking) {
                attackProgress += delta * 6; // Swing speed
                
                if (attackProgress < 0.5) {
                    // Swing down
                    const p = attackProgress * 2;
                    swordGroup.rotation.x = -Math.PI / 4 - (p * Math.PI / 2.5);
                    swordGroup.position.z = -4 - (p * 2);
                } else if (attackProgress < 1.0) {
                    // Swing back up
                    const p = (attackProgress - 0.5) * 2;
                    swordGroup.rotation.x = -Math.PI / 4 - (Math.PI / 2.5) + (p * Math.PI / 2.5);
                    swordGroup.position.z = -6 + (p * 2);
                } else {
                    // End attack
                    isAttacking = false;
                    swordGroup.rotation.x = -Math.PI / 4;
                    swordGroup.position.z = -4;
                }
            }

            // --- Enemy AI (Passive Skeletons) ---
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                // Passive idle bobbing
                enemy.position.y = 2 + Math.sin((time/1000) * 2 + enemy.userData.bobOffset) * 0.5;
                
                // Look at player slowly
                const playerPos = controls.getObject().position;
                const targetRotation = Math.atan2(playerPos.x - enemy.position.x, playerPos.z - enemy.position.z);
                // Interpolate rotation for smooth turning
                const currentRotation = enemy.rotation.y;
                enemy.rotation.y = currentRotation + (targetRotation - currentRotation) * delta * 2;
            }
        }

        prevTime = time;
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
